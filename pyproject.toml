[project]
name = "mcpscan"
version = "0.1.0"
description = "Static and dynamic security scanner for Model Context Protocol servers"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["mcp", "security", "scanner", "sast", "sarif", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "regex>=2026.7.19",
    "typer>=0.27.1",
]

[project.urls]
Homepage = "https://github.com/Kavennesh/mcpscan"
Issues = "https://github.com/Kavennesh/mcpscan/issues"

[project.scripts]
mcpscan = "mcpscan.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The bundled rule pack is data, not code, so it needs saying explicitly or an
# installed mcpscan has an empty rule set and reports every target as clean.
source-include = ["src/mcpscan/rules/*.yaml"]

[dependency-groups]
dev = [
    # Validates every SARIF document the exporter produces against the vendored
    # OASIS 2.1.0 schema. Dev only: nothing in `src/` imports it, and a scanner
    # that needed a validator at runtime to emit valid output would be admitting
    # it does not know what it is emitting.
    "jsonschema>=4.26.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
    # Stubs only. `regex` and `pyyaml` are already runtime dependencies; without
    # these mypy --strict cannot see through them, and the rule engine's two
    # most security-relevant modules go unchecked.
    "types-regex>=2024.11.6",
    "types-PyYAML>=6.0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "sandbox: requires a working Docker daemon",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S603", "S607"]  # subprocess calls are the point; confined to sandbox.py

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fake credentials are the point
"tests/fixtures/escapes/**" = ["S"]    # hostile payloads are the point; see test_containment.py

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
